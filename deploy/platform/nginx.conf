server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 24m;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    location /studio-api/ {
        proxy_pass http://studio:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }
    location = /admin-api/settings {
        proxy_pass http://studio:8787;
        proxy_set_header Origin $http_origin;
    }
    location /admin-api/ { return 404; }
    location /api-proxy/ { return 404; }
    location /api/ { return 404; }
    location /docs/ { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
