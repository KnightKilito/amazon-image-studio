adminServer:
  # 开发时 Vite 转发平台接口的端口。后台运行配置使用 STUDIO_* 环境变量。
  port: 8787

apiProxy:
  # 仅纯前端模式适用：开发时 Vite 向固定 target 转发。平台模式强制绕过此配置。
  enabled: false
  # true 表示前端强制使用代理，用户不能在设置里关闭。
  locked: false
  prefix: /api-proxy
  # 保留旧配置兼容；不要在公网开放动态目标代理。平台后端不支持动态目标。
  allowAllTargets: false
  # allowAllTargets 为 false 时，可以在这里列出允许代理的 API base URL。
  allowedTargets: []
  # 兼容旧固定目标模式；如果请求没有携带 target 参数，会回退到这个地址。
  target: ""
  changeOrigin: true
  secure: true
